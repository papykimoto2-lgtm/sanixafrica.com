# SNIFI — environnement de développement / démonstration
#   docker compose up --build   →  http://localhost:3000  (admin / snifi2026)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: snifi
      POSTGRES_USER: snifi
      POSTGRES_PASSWORD: snifi
    ports: ["5432:5432"]
    volumes: [snifi-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snifi -d snifi"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      DATABASE_URL: postgres://snifi:snifi@db:5432/snifi
      JWT_SECRET: ${JWT_SECRET:-changer-ce-secret-en-production}
      SNIFI_SEED: "1"            # charge le jeu de démonstration (à retirer en production)
    ports: ["3001:3001"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./web
      args: { SNIFI_API_URL: "http://api:3001" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  snifi-db:
